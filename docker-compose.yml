services:
  db:
    container_name: db
    image: mysql:8.4.5
    restart: always
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: 1
      MYSQL_DATABASE: test
      MYSQL_USER: test
      MYSQL_PASSWORD: test
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    container_name: phpmyadmin
    image: phpmyadmin:5.2.2
    environment:
      PMA_HOST: db
      PMA_USER: test
      PMA_PASSWORD: test
    ports:
      - '3307:80'
    depends_on:
      - db

volumes:
  db_data:
